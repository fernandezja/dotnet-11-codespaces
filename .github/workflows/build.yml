name: Build and Test Solution

on:
  pull_request:
    branches:
      - main
      
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SampleApp/SampleApp.sln

      - name: Build solution
        run: dotnet build SampleApp/SampleApp.sln --no-restore --configuration Release

      - name: Test solution
        run: dotnet test SampleApp/SampleApp.sln --no-build --configuration Release